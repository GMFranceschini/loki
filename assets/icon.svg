<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Loki">
  <title>Loki</title>
  <desc>A tesseract: a cube within a cube, corners joined, vertices marked.</desc>

  <!--
    Minimal geometric mark: a 2D projection of a hypercube, with its eight
    visible vertices marked. Solid fills and plain strokes only — no
    gradients, no blur filters, no embedded fonts — so every renderer draws
    it identically and it stays legible at 16 px. The geometry is plain
    mathematics, not anyone's artwork.

    The inner cube is offset up and to the right rather than centred. A
    concentric version reads as a picture frame; the offset is what makes
    the projection look like four dimensions.
  -->

  <rect x="32" y="32" width="960" height="960" rx="216" fill="#2A1142"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="24">
    <!-- the four edges joining the outer cube to the inner one -->
    <g stroke="#8E5BC4">
      <line x1="196" y1="196" x2="416" y2="340"/>
      <line x1="828" y1="196" x2="716" y2="340"/>
      <line x1="828" y1="828" x2="716" y2="630"/>
      <line x1="196" y1="828" x2="416" y2="630"/>
    </g>
    <rect x="196" y="196" width="632" height="632" stroke="#F0E4FF"/>
    <rect x="416" y="340" width="300" height="290" stroke="#C77DFF"/>
  </g>

  <!-- the eight vertices -->
  <g fill="#FFD166">
    <circle cx="196" cy="196" r="34"/>
    <circle cx="828" cy="196" r="34"/>
    <circle cx="828" cy="828" r="34"/>
    <circle cx="196" cy="828" r="34"/>
    <circle cx="416" cy="340" r="30"/>
    <circle cx="716" cy="340" r="30"/>
    <circle cx="716" cy="630" r="30"/>
    <circle cx="416" cy="630" r="30"/>
  </g>
</svg>
