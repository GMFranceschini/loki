[project]
name = "loki"
version = "0.1.0"
description = "Local daily biology literature radar: fetch, score, rank."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
    "numpy>=2.1.0",
    "model2vec>=0.4.0",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
loki = "loki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
